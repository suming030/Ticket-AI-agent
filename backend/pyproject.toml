[project]
name = "ticket-ai-agent"
version = "0.1.0"
description = "매진 기차 취소표 감시 AI 에이전트 — 1단계 Mock"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "sqlmodel>=0.0.22,<1",
  "apscheduler>=3.10,<4",
  "uvicorn>=0.34,<1",
  "httpx>=0.27,<1"
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
